name: Claude mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Off until the repo variable CLAUDE_REVIEW_ENABLED is 'true' and CLAUDE_CODE_OAUTH_TOKEN is set.
    if: vars.CLAUDE_REVIEW_ENABLED == 'true'
    uses: nextjedi/platform/.github/workflows/claude-mention.yml@main
    secrets: inherit
